<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tech-Noir Racing HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

        * { box-sizing: border-box; touch-action: none; user-select: none; margin: 0; padding: 0; }
        
        body { 
            background-color: #020304; 
            font-family: 'Rajdhani', sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
            background: linear-gradient(135deg, #090b10 0%, #020304 100%);
        }
        
        #portrait-warning { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #00ff66; color: #000; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; font-size: 32px; font-weight: 900; letter-spacing: 2px; }
        @media screen and (orientation: portrait) { #portrait-warning { display: flex; } }

        /* =========================================
           AMBIENT COCKPIT
           ========================================= */
        .tech-grid {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .scanlines {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 90; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%; opacity: 0.5; mix-blend-mode: overlay;
        }

        #bg-halo {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none;
            background: radial-gradient(circle at 50% 100%, rgba(255, 0, 60, 0.25) 0%, rgba(255, 0, 60, 0.05) 40%, transparent 70%);
            opacity: 0; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #bg-halo.redline { opacity: 1; }

        .hud-frame { position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px; z-index: 5; pointer-events: none; border: 1px solid rgba(0, 243, 255, 0.1); }
        .hud-corner { position: absolute; width: 30px; height: 30px; border-color: rgba(0, 243, 255, 0.5); border-style: solid; }
        .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        /* =========================================
           HITBOX MANAGEMENT
           ========================================= */
        .fat-finger { position: relative; }
        .fat-finger::before { content: ''; position: absolute; top: -35px; left: -35px; right: -35px; bottom: -35px; border-radius: inherit; z-index: 10; }
        .abxy-btn { position: absolute; z-index: 20; }
        .abxy-btn::before { content: ''; position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px; border-radius: 50%; z-index: 10; }

        /* =========================================
           THE FLEXBOX GRID
           ========================================= */
        #ui-grid {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px 3vw; z-index: 10; pointer-events: none; 
        }
        #ui-grid * { pointer-events: auto; } 

        #top-row { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 10px; }
        #middle-row { display: flex; justify-content: space-between; align-items: center; width: 100%; flex: 1; }
        #bottom-row { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding-bottom: 5px; }

        .control-cluster { display: flex; align-items: center; gap: 4vw; }
        .pedal-cluster { display: flex; align-items: flex-end; gap: 12px; }

        /* =========================================
           TOP DASHBOARD & DYNAMIC RPM BAR
           ========================================= */
        #rpm-container {
            width: 50%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; 
            border: 1px solid rgba(0, 243, 255, 0.2); overflow: hidden; margin-top: 5px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }
        #rpm-fill {
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, #00f3ff 0%, #00ff66 40%, #ffea00 75%, #ff003c 100%);
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #telemetry-dash-container { display: flex; align-items: center; gap: 20px; }

        .side-hud { font-family: 'Share Tech Mono', monospace; color: #4a5c75; font-size: 10px; text-shadow: 0 0 5px rgba(0, 243, 255, 0.2); letter-spacing: 1px; display: flex; flex-direction: column; gap: 4px; }
        .side-hud span { background: rgba(0,0,0,0.5); padding: 2px 6px; border: 1px solid rgba(0,243,255,0.1); border-radius: 2px; }
        #tune-btn { cursor: pointer; color: #00f3ff; border-color: rgba(0,243,255,0.45) !important; }
        #tune-btn.active { background: rgba(0,243,255,0.15); }

        /* =========================================
           STEERING TUNE PANEL
           ========================================= */
        #tune-backdrop {
            display: none; position: fixed; inset: 0; z-index: 299;
            background: rgba(0,0,0,0.72); backdrop-filter: blur(3px);
        }
        #tune-backdrop.open { display: block; }
        #tune-panel {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 300;
            width: min(380px, 88vw); padding: 18px 20px;
            background: rgba(5,8,14,0.98); color: #00f3ff;
            border: 1px solid rgba(0,243,255,0.55);
            box-shadow: 0 0 45px rgba(0,243,255,0.22), inset 0 0 30px rgba(0,243,255,0.04);
            font-family: 'Rajdhani', sans-serif; letter-spacing: 1px;
            flex-direction: column; gap: 13px;
            max-height: 88vh; overflow-y: auto; touch-action: pan-y;
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
        }
        #tune-panel.open { display: flex; }
        #tune-title { font-family: 'Share Tech Mono', monospace; font-size: 15px; letter-spacing: 3px; text-align: center; border-bottom: 1px solid rgba(0,243,255,0.25); padding-bottom: 8px; }
        .tune-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 700; }
        .tune-row input[type=range] { flex: 1; min-width: 80px; accent-color: #00f3ff; touch-action: auto; }
        .tune-row input[type=checkbox] { width: 20px; height: 20px; accent-color: #00f3ff; touch-action: auto; }
        .tune-row b { min-width: 46px; text-align: right; color: #00ff66; font-family: 'Share Tech Mono', monospace; font-weight: 400; }
        #tune-panel button {
            font-family: 'Rajdhani', sans-serif; font-weight: 900; letter-spacing: 2px;
            font-size: 14px; padding: 11px 12px; cursor: pointer;
            color: #00f3ff; background: rgba(0,243,255,0.06);
            border: 1px solid rgba(0,243,255,0.4); text-transform: uppercase;
        }
        #tune-panel button:active { background: rgba(0,243,255,0.2); }
        #tune-reset { color: #ff6b7f; border-color: rgba(255,0,60,0.4); background: rgba(255,0,60,0.06); }
        #tune-status { min-height: 16px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #00ff66; }

        .tune-section-title {
            font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 2px;
            color: #4a5c75; border-bottom: 1px solid rgba(0,243,255,0.12); padding-bottom: 4px;
        }
        #preset-options { display: flex; gap: 9px; }
        #tune-panel .preset-opt {
            flex: 1 1 0; padding: 9px 7px; font-size: 13px; line-height: 1.2;
            letter-spacing: 1px; text-transform: none;
        }
        #tune-panel .preset-opt small {
            display: block; font-size: 9px; letter-spacing: 1px; opacity: 0.65;
            margin-top: 3px; text-transform: uppercase;
        }
        #tune-panel .preset-opt.selected {
            color: #00ff66; border-color: #00ff66; background: rgba(0,255,102,0.12);
            box-shadow: 0 0 18px rgba(0,255,102,0.18), inset 0 0 12px rgba(0,255,102,0.06);
        }
        #preset-help {
            min-height: 30px; text-align: center; font-family: 'Share Tech Mono', monospace;
            font-size: 10px; line-height: 1.5; color: #7d90ab;
        }
        #gyro-status {
            min-height: 14px; text-align: center; font-family: 'Share Tech Mono', monospace;
            font-size: 10px; letter-spacing: 1px; line-height: 1.4; color: #7d90ab;
        }
        #preset-btn { cursor: pointer; color: #00f3ff; border-color: rgba(0,243,255,0.45) !important; }
        #preset-btn.active { background: rgba(0,243,255,0.15); }

        .cozy-only { display: none !important; }
        body.preset-cozy .cozy-only { display: inline-block !important; }
        body.preset-cozy .racing-only { display: none !important; }
        body.preset-cozy #rpm-container { visibility: hidden; }
        body.preset-cozy #steerVal { font-size: 16px; }

        /* Cozy layout: remove the controls that Stardew does not need and make
           the sticks / face buttons / item controls thumb-sized. */
        body.preset-cozy #ebrake-btn,
        body.preset-cozy #dpad,
        body.preset-cozy #guide-btn { display: none !important; }

        body.preset-cozy #ui-grid { padding: 10px 2vw; }
        body.preset-cozy .control-cluster { gap: 2vw; }
        body.preset-cozy #left-stick,
        body.preset-cozy #right-stick {
            width: clamp(130px, 21vw, 185px);
            height: clamp(130px, 21vw, 185px);
        }
        body.preset-cozy .joystick-cap { width: 64%; height: 64%; }
        body.preset-cozy #abxy {
            width: clamp(150px, 23vw, 205px);
            height: clamp(150px, 23vw, 205px);
        }
        body.preset-cozy .abxy-btn { width: 33%; height: 33%; font-size: clamp(24px, 3.4vw, 30px); }
        body.preset-cozy #center-console { gap: 10px; }
        body.preset-cozy .small-btn {
            width: clamp(44px, 5.5vw, 54px);
            height: clamp(44px, 5.5vw, 54px);
        }
        body.preset-cozy .pedal-cluster { gap: 14px; }
        body.preset-cozy .trigger {
            width: clamp(108px, 14vw, 145px);
            height: clamp(74px, 9.5vh, 95px);
            font-size: clamp(15px, 2vw, 18px);
            padding-bottom: 14px;
        }
        body.preset-cozy .bumper {
            width: clamp(92px, 11vw, 120px);
            height: clamp(54px, 7vh, 66px);
            font-size: clamp(12px, 1.5vw, 14px);
        }

        #telemetry-dash {
            width: 300px; height: 50px; background: rgba(5, 8, 14, 0.85);
            backdrop-filter: blur(12px); border-bottom: 2px solid #00f3ff;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            color: #00f3ff; font-weight: 700;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 1.2s ease-out;
        }
        
        #telemetry-dash.redline {
            border-bottom: 2px solid #ff003c; color: #ff003c;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.4), 0 8px 20px rgba(0,0,0,0.8);
            background: rgba(20, 5, 5, 0.9);
        }
        
        .dash-label { font-size: 11px; color: #4a5c75; text-align: center; display: block; letter-spacing: 2px; transition: color 1.2s;}
        .dash-value { text-shadow: 0 0 12px currentColor; font-size: 20px; display: block; transition: color 1.2s, text-shadow 1.2s;}
        #telemetry-dash.redline .dash-label { color: #8a3c45; }

        /* =========================================
           CONTROLS
           ========================================= */
        #center-console { display: flex; align-items: center; gap: 15px; }
        
        #guide-btn { 
            width: 50px; height: 50px; background: #0c1017; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), 0 5px 15px rgba(0,0,0,0.9), 0 0 0 2px #040507, 0 0 0 4px #0c1017; 
            transition: all 0.2s; flex-shrink: 0;
        }
        #guide-logo { color: #2d3b4f; font-weight: 900; font-size: 24px; }
        .connected #guide-btn { box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 5px 15px rgba(0,0,0,0.9), 0 0 0 2px #040507, 0 0 0 4px #0c1017, 0 0 25px rgba(0, 255, 102, 0.4); }
        .connected #guide-logo { color: #00ff66; text-shadow: 0 0 15px #00ff66; }

        .small-btn { 
            width: 38px; height: 38px; background: #0a0d14; border-radius: 50%; 
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), inset 0 -2px 4px rgba(0,0,0,0.8), 0 5px 10px rgba(0,0,0,0.8); 
            border: 1px solid #151b26; display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .small-btn.active { transform: scale(0.9); box-shadow: inset 0 4px 8px rgba(0,0,0,0.9); }
        .icon-bars { width: 12px; height: 8px; border-top: 2px solid #4a5c75; border-bottom: 2px solid #4a5c75; }
        .icon-squares { width: 12px; height: 12px; border: 2px solid #4a5c75; border-radius: 2px; }

        .joystick-base { width: 130px; height: 130px; background: #040507; border-radius: 50%; box-shadow: inset 0 10px 25px rgba(0,0,0,1), 0 2px 5px rgba(255,255,255,0.02); display: flex; justify-content: center; align-items: center; flex-shrink: 0;}
        .joystick-cap { width: 85px; height: 85px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #1a202c, #080a0f); box-shadow: inset 0 0 20px rgba(0,0,0,0.8), -2px -2px 5px rgba(255,255,255,0.05), 5px 10px 20px rgba(0,0,0,0.95); border: 2px solid #11151f; position: relative; }
        .joystick-cap::after { content: ''; position: absolute; top: 20%; left: 20%; width: 60%; height: 60%; border-radius: 50%; background: #040507; box-shadow: inset 0 5px 15px rgba(0,0,0,0.95); }

        #abxy { width: 145px; height: 145px; position: relative; flex-shrink: 0; }
        .abxy-btn { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: #0a0d14; font-weight: 900; font-size: 22px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), 0 8px 15px rgba(0,0,0,0.9); border: 1px solid #151b26; transition: all 0.1s; }
        #btnY { top: 0; left: 50%; transform: translateX(-50%); color: #ffcc00; } 
        #btnY.active { transform: translateX(-50%) translateY(4px); background: #11151f; box-shadow: 0 0 30px rgba(255, 204, 0, 0.4), inset 0 5px 10px rgba(0,0,0,0.9); color: #fff; border-color: #ffcc00; text-shadow: 0 0 8px #ffcc00; }
        #btnB { right: 0; top: 50%; transform: translateY(-50%); color: #ff003c; } 
        #btnB.active { transform: translateY(-50%) translateY(4px); background: #11151f; box-shadow: 0 0 30px rgba(255, 0, 60, 0.4), inset 0 5px 10px rgba(0,0,0,0.9); color: #fff; border-color: #ff003c; text-shadow: 0 0 8px #ff003c;}
        #btnA { bottom: 0; left: 50%; transform: translateX(-50%); color: #00ff66; } 
        #btnA.active { transform: translateX(-50%) translateY(4px); background: #11151f; box-shadow: 0 0 30px rgba(0, 255, 102, 0.4), inset 0 5px 10px rgba(0,0,0,0.9); color: #fff; border-color: #00ff66; text-shadow: 0 0 8px #00ff66;}
        #btnX { left: 0; top: 50%; transform: translateY(-50%); color: #00f3ff; } 
        #btnX.active { transform: translateY(-50%) translateY(4px); background: #11151f; box-shadow: 0 0 30px rgba(0, 243, 255, 0.4), inset 0 5px 10px rgba(0,0,0,0.9); color: #fff; border-color: #00f3ff; text-shadow: 0 0 8px #00f3ff;}

        #dpad { width: 120px; height: 120px; position: relative; flex-shrink: 0; } 
        .dpad-part { position: absolute; background: #0a0d14; box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), inset 0 -5px 10px rgba(0,0,0,0.9), 0 8px 15px rgba(0,0,0,0.8); pointer-events: none; border: 1px solid #151b26; }
        .dpad-v { top: 0; left: 33.3%; width: 33.3%; height: 100%; border-radius: 4px; }
        .dpad-h { top: 33.3%; left: 0; width: 100%; height: 33.3%; border-radius: 4px; }
        .dpad-hitbox { position: absolute; width: 40%; height: 40%; z-index: 30; border-radius: 4px; transition: all 0.1s; }
        .dpad-hitbox.active { background: rgba(0, 255, 102, 0.3); box-shadow: 0 0 20px rgba(0, 255, 102, 0.6); }
        #dpad-up { top: -5px; left: 30%; } #dpad-down { bottom: -5px; left: 30%; } 
        #dpad-left { top: 30%; left: -5px; } #dpad-right { top: 30%; right: -5px; }

        .bumper { width: 85px; height: 50px; background: #0c1017; border-radius: 6px; color: #4a5c75; font-weight: 700; font-size: 15px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 2px 5px rgba(255,255,255,0.03), 0 5px 15px rgba(0,0,0,0.8); border: 1px solid #151b26; transition: all 0.1s; z-index: 20;}
        .bumper.active { background: #040507; color: #fff; box-shadow: inset 0 5px 10px rgba(0,0,0,0.9); border-color: #00f3ff; text-shadow: 0 0 10px #00f3ff; transform: translateY(4px); }

        .trigger { width: 105px; height: 75px; background: linear-gradient(to top, #0a0d14, #040507); border-radius: 6px 6px 20px 20px; color: #4a5c75; font-weight: 900; font-size: 20px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 12px; box-shadow: inset 0 -2px 2px rgba(255,255,255,0.05), 0 10px 20px rgba(0,0,0,0.9); border-bottom: 2px solid #151b26; z-index: 20; 
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .trigger.active { background: #040507; color: #fff; text-shadow: 0 0 15px #00f3ff; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.95), 0 2px 5px rgba(0,0,0,0.6); transform: translateY(4px); border-bottom-color: #00f3ff;}
        
        #rt.active { text-shadow: 0 0 15px #ff003c; border-bottom-color: #ff003c; }

        #ebrake-btn {
            width: 140px; height: 50px; background: linear-gradient(to bottom, #d50000, #900000); 
            color: #fff; font-weight: 900; font-size: 22px; letter-spacing: 2px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(213, 0, 0, 0.3), inset 0 2px 5px rgba(255,255,255,0.2), inset 0 -3px 5px rgba(0,0,0,0.5);
            border-bottom: 2px solid #ff5252; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.1s; z-index: 20; align-self: flex-end; margin-bottom: 5px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        #ebrake-btn.active {
            transform: translateY(4px); background: #800000; 
            box-shadow: 0 2px 5px rgba(213, 0, 0, 0.3), inset 0 3px 10px rgba(0,0,0,0.8);
            border-color: #b71c1c; color: #ffaaaa;
        }

        /* =========================================
           BOOT TERMINAL & OVERLAY
           ========================================= */
        #initOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #020304; display: flex; justify-content: center; align-items: center; z-index: 100; transition: opacity 0.18s ease; }
        #initBtn { padding: 15px 50px; background: transparent; border: 2px solid #00f3ff; color: #00f3ff; font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 6px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1); text-transform: uppercase; transition: all 0.2s; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
        #initBtn:active { transform: scale(0.95); background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 40px rgba(0, 243, 255, 0.5); }
        
        #boot-terminal { display: none; font-family: 'Share Tech Mono', monospace; color: #00ff66; font-size: 16px; line-height: 1.5; text-shadow: 0 0 5px #00ff66; width: 80%; max-width: 600px; }
    </style>
</head>
<body id="controller-body">

<div class="tech-grid"></div>
<div class="scanlines"></div>
<div id="bg-halo"></div>
<div class="hud-frame">
    <div class="hud-corner corner-tl"></div>
    <div class="hud-corner corner-tr"></div>
    <div class="hud-corner corner-bl"></div>
    <div class="hud-corner corner-br"></div>
</div>

<div id="portrait-warning">ROTATE DEVICE</div>

<div id="initOverlay">
    <button id="initBtn">SYS.IGNITION</button>
    <div id="boot-terminal"></div>
</div>

<div id="tune-backdrop"></div>
<div id="tune-panel" role="dialog" aria-label="Controller settings">
    <div id="tune-title">CONTROLLER SETTINGS</div>

    <div class="tune-section-title">GAME PRESET</div>
    <div id="preset-options">
        <button class="preset-opt" data-preset="racing" aria-pressed="true">🏎️ RACING<small>Gyro wheel</small></button>
        <button class="preset-opt" data-preset="cozy" aria-pressed="false">🌾 COZY<small>Stardew / 2D</small></button>
    </div>
    <div id="preset-help"></div>
    <div id="gyro-status">GYRO: WAITING</div>

    <div class="tune-section-title racing-only">STEERING TUNE</div>
    <label class="tune-row racing-only"><span>INVERT</span><input type="checkbox" id="tune-invert"></label>
    <label class="tune-row racing-only"><span>SENSITIVITY</span><input type="range" id="tune-sens" min="4" max="30" step="1"><b id="tune-sens-val">10°</b></label>

<script>
    "use strict";

    const $ = (id) => document.getElementById(id);
    const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
    const number = (v, fallback) => (Number.isFinite(Number(v)) ? Number(v) : fallback);
    const isNum = (v) => typeof v === "number" && Number.isFinite(v);

    const BUTTON_KEYS = [
        "handbrake", "y_btn", "x_btn", "a_btn", "lb", "rb",
        "view_btn", "menu_btn", "guide_btn",
        "dpad_up", "dpad_down", "dpad_left", "dpad_right"
    ];

    const inputState = {
        steering: 0.0, ls_x: 0.0, ls_y: 0.0, throttle: 0, brake: 0, handbrake: 0,
        y_btn: 0, x_btn: 0, a_btn: 0, lb: 0, rb: 0,
        dpad_up: 0, dpad_down: 0, dpad_left: 0, dpad_right: 0,
        view_btn: 0, menu_btn: 0, guide_btn: 0, rs_x: 0.0, rs_y: 0.0
    };

    const DEFAULTS = {
        invertSteering: false,
        centerOffset: 0.0,
        maxTilt: 10.0,
        curve: 1.0,
        deadzone: 1.2
    };
    const settings = { ...DEFAULTS };

    try {
        const saved = JSON.parse(localStorage.getItem("ezc.settings") || "{}");
        if (saved && typeof saved === "object") {
            settings.invertSteering = !!saved.invertSteering;
            settings.centerOffset = number(saved.centerOffset, 0);
            settings.maxTilt = clamp(number(saved.maxTilt, 10), 4, 30);
            settings.curve = clamp(number(saved.curve, 1), 0.5, 2);
            settings.deadzone = clamp(number(saved.deadzone, 1.2), 0, 8);
        }
    } catch (e) {}

    // Game presets change the on-screen labels and which control surfaces drive
    // the pad. Racing uses gyro steering; Cozy drives the full left stick and
    // is mapped for Stardew Valley / 2D games.
    const PRESETS = {
        racing: {
            name: "RACING",
            help: "Tilt to steer · LT/RT gas & brake · B handbrake · LB/RB gears",
            labels: { lt: "BRAKE", rt: "GAS", lb: "GEAR −", rb: "GEAR +" }
        },
        cozy: {
            name: "COZY",
            help: "Left stick move · A action · X tool · Y craft · B cancel · LT/RT item · LB/RB toolbar",
            labels: { lt: "ITEM ◀", rt: "ITEM ▶", lb: "TOOLBAR ◀", rb: "TOOLBAR ▶" }
        }
    };

    let currentPreset = "racing";
    try {
        const savedPreset = localStorage.getItem("ezc.preset");
        if (PRESETS[savedPreset]) currentPreset = savedPreset;
    } catch (e) {}

    let ws = null;
    let isConnected = false;
    let reconnectTimer = null;
    let reconnectDelay = 250;
    let sendScheduled = false;
    let sensorsStarted = false;
    let wakeLock = null;
    let lastRawTilt = null;
    let inputGeneration = 0;
    let gyroEvents = 0;
    let gyroDenied = false;
    let motionSeen = false;
    let lastGyroUi = 0;

    const leftStickCap = $("left-stick-cap");
    const rightStickCap = $("right-stick-cap");
    const steerDash = $("steerVal");
    const statusTxt = $("status-txt");
    const redlineDash = $("telemetry-dash");
    const halo = $("bg-halo");
    const rpmFill = $("rpm-fill");
    const activeSources = new Map();

    function saveSettings() {
        try { localStorage.setItem("ezc.settings", JSON.stringify(settings)); } catch (e) {}
    }

    // ---- output: change-driven, coalesced to one send per display frame ----
    function scheduleSend(immediate = false) {
        // Discrete actions (press/release) go out immediately; continuous
        // motion (gyro/touch move) is coalesced into the next display frame.
        if (immediate) {
            sendState();
            return;
        }
        if (sendScheduled) return;
        sendScheduled = true;
        requestAnimationFrame(() => {
            sendScheduled = false;
            sendState();
        });
    }

    function sendState() {
        if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
        if (ws.bufferedAmount > 8192) return; // never build a queue of stale frames
        ws.send(JSON.stringify(inputState));
    }

    // ---- websocket: immediate reconnect, works through HTTPS tunnels ----
    function connectWebSocket() {
        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
        try {
            const protocol = location.protocol === "https:" ? "wss://" : "ws://";
            ws = new WebSocket(protocol + location.host + "/ws");

            ws.onopen = () => {
                isConnected = true;
                reconnectDelay = 250;
                const guide = $("guide-btn");
                if (guide && guide.parentElement) guide.parentElement.classList.add("connected");
                statusTxt.innerText = "ONLINE";
                statusTxt.style.color = "#00f3ff";
                sendState();
            };

            ws.onerror = () => {
                try { ws.close(); } catch (e) {}
            };

            ws.onclose = () => {
                isConnected = false;
                const guide = $("guide-btn");
                if (guide && guide.parentElement) guide.parentElement.classList.remove("connected");
                statusTxt.innerText = "OFFLINE";
                statusTxt.style.color = "#ff003c";
                if (reconnectTimer) return;
                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    connectWebSocket();
                }, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, 2000);
            };
        } catch (e) {
            if (!reconnectTimer) {
                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    connectWebSocket();
                }, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, 2000);
            }
        }
    }

    // ---- gyro steering ----
    function screenAngle() {
        if (screen.orientation && isNum(screen.orientation.angle)) return screen.orientation.angle;
        if (isNum(window.orientation)) return window.orientation;
        return 0;
    }

    function orientationAngle(event) {
        if (!event) return null;
        // Gamma is the left/right roll. It is only a fallback: when the phone
        // is held upright (the normal racing position) beta sits near ±90° and
        // gamma becomes unstable, flipping between -90 and +90.
        let tilt = isNum(event.gamma) ? event.gamma : event.beta;
        if (!isNum(tilt)) return null;
        const angle = ((screenAngle() % 360) + 360) % 360;
        if (angle === 270) tilt = -tilt;
        return tilt;
    }

    function gravityAngle(event) {
        const g = event.accelerationIncludingGravity;
        if (!g || !isNum(g.x) || !isNum(g.y)) return null;
        // When the phone lies flat, gravity points through the screen and the
        // in-plane angle is meaningless. Keep the orientation fallback then.
        if (Math.hypot(g.x, g.y) < 2.0) return null;
        // Upright in landscape: gravity lies along the device X axis (±90°).
        // Rotating the phone like a wheel moves that vector smoothly in the
        // screen plane, with no Euler gimbal lock.
        let angle = Math.atan2(g.x, -g.y) * 180 / Math.PI;
        const screen = ((screenAngle() % 360) + 360) % 360;
        if (screen === 270) angle = -angle;
        return angle;
    }

    function applySteering(raw) {
        let tilt = raw - settings.centerOffset;
        // Wrap across ±180 so calibration near ±90/±180 never jumps.
        tilt = ((tilt + 180) % 360 + 360) % 360 - 180;
        // A ~180° offset means an old calibration came from the fallback axis
        // or the other landscape orientation. Recentre instead of pinning the
        // wheel at full lock.
        if (Math.abs(tilt) > 150) {
            settings.centerOffset = raw;
            saveSettings();
            tilt = 0;
        }
        if (settings.invertSteering) tilt = -tilt;

        if (Math.abs(tilt) < settings.deadzone) tilt = 0;
        else tilt = Math.sign(tilt) * (Math.abs(tilt) - settings.deadzone);

        const steering = clamp(tilt / settings.maxTilt, -1, 1);
        const curved = Math.sign(steering) * Math.pow(Math.abs(steering), settings.curve);

        inputState.steering = curved;
        inputState.ls_x = curved;
        inputState.ls_y = 0;
        steerDash.innerText = (curved * 90).toFixed(1) + "°";
        if (leftStickCap) leftStickCap.style.transform = `translateX(${curved * 22}px)`;
        scheduleSend();
    }

    function onOrientation(event) {
        const raw = orientationAngle(event);
        if (raw === null) return;
        gyroEvents++;
        if (motionSeen) return; // gravity is the stable source
        lastRawTilt = raw;

        // Cozy preset uses the touch left stick, not the gyro.
        if (currentPreset !== "racing") return;

        const now = performance.now();
        if (now - lastGyroUi > 120) {
            lastGyroUi = now;
            const beta = isNum(event.beta) ? event.beta.toFixed(0) : "--";
            const gamma = isNum(event.gamma) ? event.gamma.toFixed(0) : "--";
            setGyroStatus("GYRO: LIVE (FALLBACK) · \u03b2 " + beta + "\u00b0 \u03b3 " + gamma + "\u00b0", "#ffcc00");
        }
        applySteering(raw);
    }

    function onMotion(event) {
        const raw = gravityAngle(event);
        if (raw === null) return;
        motionSeen = true;
        lastRawTilt = raw;
        gyroEvents++;

        // Gravity's neutral angle is around ±90° in landscape. If the user has
        // never calibrated, take the first sample as centre so the wheel does
        // not start pinned at full lock.
        if (settings.centerOffset === 0 && Math.abs(raw) > 30) {
            settings.centerOffset = raw;
            saveSettings();
        }

        if (currentPreset !== "racing") return;

        const now = performance.now();
        if (now - lastGyroUi > 120) {
            lastGyroUi = now;
            setGyroStatus("GYRO: LIVE · GRAVITY " + raw.toFixed(0) + "\u00b0", "#00ff66");
        }
        applySteering(raw);
    }

    // ---- buttons (multi-touch safe, handles cancellation) ----
    function setButton(key, source, pressed) {
        let sources = activeSources.get(key);
        if (!sources) {
            sources = new Set();
            activeSources.set(key, sources);
        }
        if (pressed) sources.add(source);
        else sources.delete(source);
        inputState[key] = sources.size > 0 ? 1 : 0;
    }

    function bindButton(id, key) {
        const el = $(id);
        if (!el) return;
        let touchId = null;
        let generation = inputGeneration;

        const press = (event) => {
            if (generation !== inputGeneration) {
                touchId = null;
                generation = inputGeneration;
            }
            if (touchId !== null) return;
            const touch = event.changedTouches && event.changedTouches[0];
            if (!touch) return;
            event.preventDefault();
            touchId = touch.identifier;
            setButton(key, id, true);
            el.classList.add("active");
            if (id === "rt") setRedline(currentPreset === "racing");
            scheduleSend(true);
        };

        const release = (event) => {
            if (generation !== inputGeneration) {
                touchId = null;
                generation = inputGeneration;
                return;
            }
            if (touchId === null) return;
            const ended = Array.from(event.changedTouches || []).some((t) => t.identifier === touchId);
            if (!ended) return;
            event.preventDefault();
            touchId = null;
            setButton(key, id, false);
            el.classList.remove("active");
            if (id === "rt") setRedline(false);
            scheduleSend(true);
        };

        el.addEventListener("touchstart", press, { passive: false });
        el.addEventListener("touchend", release, { passive: false });
        el.addEventListener("touchcancel", release, { passive: false });
    }

    // ---- right thumbstick ----
    function setupRightStick() {
        const el = $("right-stick");
        if (!el) return;
        let radius = 30;
        let rect = null;
        let touchId = null;
        let generation = inputGeneration;

        const update = (touch) => {
            if (!rect) rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const distance = Math.hypot(dx, dy);
            if (distance > radius) {
                dx = (dx / distance) * radius;
                dy = (dy / distance) * radius;
            }
            rightStickCap.style.transform = `translate(${dx}px, ${dy}px)`;
            inputState.rs_x = dx / radius;
            inputState.rs_y = -dy / radius;
            scheduleSend();
        };

        el.addEventListener("touchstart", (event) => {
            if (generation !== inputGeneration) {
                touchId = null;
                generation = inputGeneration;
            }
            if (touchId !== null) return;
            const touch = event.changedTouches && event.changedTouches[0];
            if (!touch) return;
            event.preventDefault();
            touchId = touch.identifier;
            rect = el.getBoundingClientRect();
            radius = rect.width * 0.22; // scale the throw with the stick size
            update(touch);
            scheduleSend(true);
        }, { passive: false });

        el.addEventListener("touchmove", (event) => {
            if (touchId === null) return;
            const touch = Array.from(event.touches || []).find((t) => t.identifier === touchId);
            if (!touch) return;
            event.preventDefault();
            update(touch);
        }, { passive: false });

        const release = (event) => {
            if (generation !== inputGeneration) {
                touchId = null;
                generation = inputGeneration;
                return;
            }
            if (touchId === null) return;
            const ended = Array.from(event.changedTouches || []).some((t) => t.identifier === touchId);
            if (!ended) return;
            event.preventDefault();
            touchId = null;
            rect = null;
            inputState.rs_x = 0;
            inputState.rs_y = 0;
            rightStickCap.style.transform = "translate(0px, 0px)";
            scheduleSend(true);
        };
        el.addEventListener("touchend", release, { passive: false });
        el.addEventListener("touchcancel", release, { passive: false });
    }

    // ---- left thumbstick (cozy preset) ----
    function setupLeftStick() {
        const el = $("left-stick");
        if (!el) return;
        let radius = 30;
        let rect = null;
        let touchId = null;
        let generation = inputGeneration;

        const update = (touch) => {
            if (!rect) rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const distance = Math.hypot(dx, dy);
            if (distance > radius) {
                dx = (dx / distance) * radius;
                dy = (dy / distance) * radius;
            }
            leftStickCap.style.transform = `translate(${dx}px, ${dy}px)`;
            inputState.ls_x = dx / radius;
            inputState.ls_y = -dy / radius;
            inputState.steering = inputState.ls_x; // legacy field
            steerDash.innerText = inputState.ls_x.toFixed(1) + ", " + inputState.ls_y.toFixed(1);
            scheduleSend();
        };

        el.addEventListener("touchstart", (event) => {
            if (currentPreset !== "cozy") return;
            if (generation !== inputGeneration) {
                touchId = null;
                generation = inputGeneration;
            }
            if (touchId !== null) return;
            const touch = event.changedTouches && event.changedTouches[0];
            if (!touch) return;
            event.preventDefault();
            touchId = touch.identifier;
            rect = el.getBoundingClientRect();
            radius = rect.width * 0.22; // scale the throw with the stick size
            update(touch);
            scheduleSend(true);
        }, { passive: false });

        el.addEventListener("touchmove", (event) => {
            if (currentPreset !== "cozy" || touchId === null) return;
            const touch = Array.from(event.touches || []).find((t) => t.identifier === touchId);
            if (!touch) return;
            event.preventDefault();
            update(touch);
        }, { passive: false });

        const release = (event) => {
            if (generation !== inputGeneration) {
                touchId = null;
                generation = inputGeneration;
                return;
            }
            if (touchId === null) return;
            const ended = Array.from(event.changedTouches || []).some((t) => t.identifier === touchId);
            if (!ended) return;
            event.preventDefault();
            touchId = null;
            rect = null;
            inputState.ls_x = 0;
            inputState.ls_y = 0;
            inputState.steering = 0;
            leftStickCap.style.transform = "translate(0px, 0px)";
            if (currentPreset === "cozy") steerDash.innerText = "0.0, 0.0";
            scheduleSend(true);
        };
        el.addEventListener("touchend", release, { passive: false });
        el.addEventListener("touchcancel", release, { passive: false });
    }

    // ---- safety ----
    function setRedline(on) {
        if (redlineDash) redlineDash.classList.toggle("redline", on);
        if (halo) halo.classList.toggle("redline", on);
        if (rpmFill) rpmFill.style.width = on ? "100%" : "0%";
    }

    function releaseAll() {
        inputGeneration++;
        activeSources.clear();
        for (const key of BUTTON_KEYS) inputState[key] = 0;
        inputState.throttle = 0;
        inputState.brake = 0;
        inputState.rs_x = 0;
        inputState.rs_y = 0;
        inputState.steering = 0;
        inputState.ls_x = 0;
        inputState.ls_y = 0;
        document.querySelectorAll(".active").forEach((el) => {
            if (el.id !== "tune-btn" && el.id !== "preset-btn") el.classList.remove("active");
        });
        if (rightStickCap) rightStickCap.style.transform = "translate(0px, 0px)";
        if (leftStickCap) leftStickCap.style.transform = "translate(0px, 0px)";
        if (steerDash) steerDash.innerText = currentPreset === "cozy" ? "0.0, 0.0" : "0.0°";
        setRedline(false);
        scheduleSend(true);
    }

    // ---- wake lock ----
    async function requestWakeLock() {
        try {
            if (!("wakeLock" in navigator) || wakeLock) return;
            wakeLock = await navigator.wakeLock.request("screen");
            wakeLock.addEventListener("release", () => { wakeLock = null; });
        } catch (e) {}
    }

    // ---- game presets ----
    function gyroNeedsHttps() {
        return location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1";
    }

    function setGyroStatus(text, color) {
        const el = $("gyro-status");
        if (!el) return;
        el.innerText = text;
        el.style.color = color || "#7d90ab";
    }

    function updatePresetUI() {
        document.querySelectorAll(".preset-opt").forEach((button) => {
            const selected = button.dataset.preset === currentPreset;
            button.classList.toggle("selected", selected);
            button.setAttribute("aria-pressed", selected ? "true" : "false");
        });
        const help = $("preset-help");
        if (help) help.innerText = PRESETS[currentPreset].help;
    }

    function applyPreset(name, options = {}) {
        if (!PRESETS[name]) name = "racing";
        if (options.release !== false) releaseAll();

        currentPreset = name;
        const preset = PRESETS[name];
        const cozy = name === "cozy";

        document.body.classList.toggle("preset-racing", !cozy);
        document.body.classList.toggle("preset-cozy", cozy);

        for (const [id, label] of Object.entries(preset.labels)) {
            const el = $(id);
            if (el) el.innerText = label;
        }

        const steerLabel = $("steer-label");
        if (steerLabel) steerLabel.innerText = cozy ? "MOVE" : "STEERING";
        const presetButton = $("preset-btn");
        if (presetButton) presetButton.innerText = "PRESET: " + preset.name;
        if (leftStickCap) {
            leftStickCap.style.transition = cozy ? "none" : "transform 0.05s ease-out";
            leftStickCap.style.transform = "translate(0px, 0px)";
        }
        if (steerDash) steerDash.innerText = cozy ? "0.0, 0.0" : "0.0°";

        if (cozy) {
            setGyroStatus("GYRO: OFF IN COZY PRESET", "#7d90ab");
        } else if (gyroNeedsHttps()) {
            setGyroStatus("GYRO: NEEDS HTTPS \u2014 RUN controller up", "#ffcc00");
        } else if (gyroEvents > 0) {
            setGyroStatus("GYRO: LIVE", "#00ff66");
        } else {
            setGyroStatus("GYRO: TAP IGNITION AND ALLOW MOTION", "#00f3ff");
        }

        updatePresetUI();
        try { localStorage.setItem("ezc.preset", name); } catch (e) {}
        // releaseAll() already sent a neutral frame when it ran.
        if (!options.silent && options.release === false) scheduleSend(true);
    }

    // ---- steering tuning UI ----
    function updateTuneUI() {
        const invert = $("tune-invert");
        const sens = $("tune-sens");
        const dz = $("tune-dz");
        if (invert) invert.checked = settings.invertSteering;
        if (sens) sens.value = String(settings.maxTilt);
        if (dz) dz.value = String(settings.deadzone);
        const sensVal = $("tune-sens-val");
        const dzVal = $("tune-dz-val");
        if (sensVal) sensVal.innerText = settings.maxTilt.toFixed(0) + "°";
        if (dzVal) dzVal.innerText = settings.deadzone.toFixed(1) + "°";
    }

    function openTune(open) {
        const panel = $("tune-panel");
        const backdrop = $("tune-backdrop");
        const button = $("tune-btn");
        if (!panel || !backdrop) return;
        panel.classList.toggle("open", open);
        backdrop.classList.toggle("open", open);
        if (button) button.classList.toggle("active", open);
        const presetButton = $("preset-btn");
        if (presetButton) presetButton.classList.toggle("active", open);
        if (open) {
            updateTuneUI();
            updatePresetUI();
        }
    }

    function tuneStatus(text) {
        const el = $("tune-status");
        if (!el) return;
        el.innerText = text;
        if (text) {
            setTimeout(() => { if (el.innerText === text) el.innerText = ""; }, 1600);
        }
    }

    function setupTuneUI() {
        const button = $("tune-btn");
        if (!button) return;

        button.addEventListener("click", () => {
            const panel = $("tune-panel");
            openTune(!panel.classList.contains("open"));
        });
        $("preset-btn").addEventListener("click", () => {
            const panel = $("tune-panel");
            openTune(!panel.classList.contains("open"));
        });
        document.querySelectorAll(".preset-opt").forEach((option) => {
            option.addEventListener("click", () => {
                applyPreset(option.dataset.preset);
                tuneStatus(PRESETS[currentPreset].name + " PRESET LOADED");
            });
        });
        $("tune-backdrop").addEventListener("click", () => openTune(false));
        $("tune-close").addEventListener("click", () => openTune(false));

        $("tune-invert").addEventListener("change", (event) => {
            settings.invertSteering = event.target.checked;
            saveSettings();
        });

        $("tune-sens").addEventListener("input", (event) => {
            settings.maxTilt = clamp(number(event.target.value, 10), 4, 30);
            $("tune-sens-val").innerText = settings.maxTilt.toFixed(0) + "°";
            saveSettings();
        });

        $("tune-dz").addEventListener("input", (event) => {
            settings.deadzone = clamp(number(event.target.value, 1.2), 0, 8);
            $("tune-dz-val").innerText = settings.deadzone.toFixed(1) + "°";
            saveSettings();
        });

        $("tune-cal").addEventListener("click", () => {
            if (lastRawTilt === null) {
                tuneStatus("NO GYRO DATA YET");
                return;
            }
            settings.centerOffset = lastRawTilt;
            saveSettings();
            tuneStatus("CENTER CALIBRATED");
        });

        $("tune-reset").addEventListener("click", () => {
            Object.assign(settings, DEFAULTS);
            settings.centerOffset = 0;
            saveSettings();
            updateTuneUI();
            tuneStatus("DEFAULTS RESTORED");
        });
    }

    // ---- boot ----
    function startSensors() {
        if (sensorsStarted) return;
        sensorsStarted = true;

        window.addEventListener("deviceorientation", onOrientation);
        window.addEventListener("devicemotion", onMotion);
        setupLeftStick();
        setupRightStick();

        bindButton("rt", "throttle");
        bindButton("lt", "brake");
        bindButton("lb", "lb");
        bindButton("rb", "rb");
        bindButton("btnA", "a_btn");
        bindButton("btnX", "x_btn");
        bindButton("btnB", "handbrake");
        bindButton("btnY", "y_btn");
        bindButton("view-btn", "view_btn");
        bindButton("menu-btn", "menu_btn");
        bindButton("guide-btn", "guide_btn");
        bindButton("dpad-up", "dpad_up");
        bindButton("dpad-down", "dpad_down");
        bindButton("dpad-left", "dpad_left");
        bindButton("dpad-right", "dpad_right");
        bindButton("ebrake-btn", "a_btn");

        // If the browser silently withholds sensor events, say why instead of
        // leaving the steering readout at 0 forever.
        setTimeout(() => {
            if (currentPreset !== "racing" || gyroEvents > 0 || gyroDenied) return;
            setGyroStatus(
                gyroNeedsHttps()
                    ? "GYRO BLOCKED \u2014 OPEN THE HTTPS URL"
                    : "GYRO: NO EVENTS \u2014 ALLOW MOTION ACCESS",
                "#ff6b7f"
            );
        }, 1800);
    }

    function initSensors() {
        // Must run inside the tap handler on iOS for requestPermission().
        const start = () => startSensors();
        try {
            if (typeof DeviceMotionEvent !== "undefined" &&
                typeof DeviceMotionEvent.requestPermission === "function") {
                DeviceMotionEvent.requestPermission().catch(() => {});
            }
        } catch (e) {}
        try {
            if (typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function") {
                DeviceOrientationEvent.requestPermission().then(start).catch(() => {
                    gyroDenied = true;
                    setGyroStatus("GYRO: MOTION PERMISSION DENIED", "#ff6b7f");
                    startSensors();
                });
            } else {
                start();
            }
        } catch (e) {
            start();
        }
    }

    $("initBtn").addEventListener("click", () => {
        initSensors(); // stays in the user-gesture stack for iOS permission
        try {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        } catch (e) {}
        try {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(() => {});
            }
        } catch (e) {}
        requestWakeLock();

        $("initBtn").style.display = "none";
        const terminal = $("boot-terminal");
        terminal.style.display = "block";
        terminal.innerText = [
            "> UPLINK SECURE: PORT 5000",
            "> PRESET: " + PRESETS[currentPreset].name,
            currentPreset === "racing"
                ? "> GYRO MATRIX: ONLINE / DEADZONE " + settings.deadzone.toFixed(1) + "°"
                : "> LEFT STICK: ONLINE / TOUCH MOVE",
            "> CONNECTION ESTABLISHED."
        ].join("\n");
        terminal.innerHTML +=
            "<br><span style='color:#00f3ff;text-shadow:0 0 8px #00f3ff;'>UPLINK ACTIVE...</span><br>" +
            "<span style='color:#fff;text-shadow:0 0 15px #fff;font-size:24px;font-weight:bold;'>Welcome back, surx</span>";

        setTimeout(() => {
            $("initOverlay").style.opacity = "0";
            setTimeout(() => { $("initOverlay").style.display = "none"; }, 190);
        }, 120);
    });

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) releaseAll();
        else requestWakeLock();
    });
    window.addEventListener("blur", releaseAll);
    window.addEventListener("pagehide", releaseAll);
    document.addEventListener("contextmenu", (event) => event.preventDefault());

    // Connect immediately; only the motion sensors need the ignition tap.
    // The 10 Hz heartbeat keeps the server watchdog happy while a control is
    // held without any sensor movement, and changes still go out next frame.
    setupTuneUI();
    updateTuneUI();
    applyPreset(currentPreset, { silent: true, release: false });
    connectWebSocket();
    setInterval(() => { if (isConnected) sendState(); }, 100);

</script>
</body>
</html>
